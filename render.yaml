services:
  - type: web
    name: simple-logic
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NTFY_TOPIC
        sync: false
      - key: NTFY_TOKEN
        sync: false
      - key: TRADINGVIEW_SCANNER_URL
        value: https://scanner.tradingview.com/india/scan
